<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>will — тарифы</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06080a; --card:#0e1316; --card2:#121a1e; --line:#1d272c;
    --text:#f2f6f8; --muted:#7f8d94; --cyan:#22c3e6; --cyan2:#7be3f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;background:var(--bg);overflow:hidden}
  body{font-family:Manrope,Inter,sans-serif;color:var(--text);position:relative}

  /* фон: сетка + свечение + гигантская точка */
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:80px 80px;opacity:.35;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 75%)}
  .glow{position:absolute;width:1100px;height:1100px;border-radius:50%;right:-380px;top:-520px;
    background:radial-gradient(circle,rgba(34,195,230,.22),transparent 62%)}
  .glow.b{left:-500px;bottom:-700px;top:auto;right:auto;background:radial-gradient(circle,rgba(34,195,230,.10),transparent 60%)}
  .dot-xl{position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;bottom:-170px;
    border:2px solid rgba(34,195,230,.18)}
  .dot-xl::after{content:"";position:absolute;inset:60px;border-radius:50%;border:2px solid rgba(34,195,230,.10)}

  .wrap{position:relative;z-index:2;padding:72px 96px 0}

  header{display:flex;align-items:flex-end;justify-content:space-between}
  .logo{font-family:Unbounded,sans-serif;font-weight:800;font-size:64px;letter-spacing:-2px;line-height:1}
  .logo i{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--cyan);margin-left:5px;
    box-shadow:0 0 24px var(--cyan)}
  .head-r{text-align:right}
  h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:76px;letter-spacing:-2px;line-height:1}
  h1 span{color:var(--cyan)}
  .sub{margin-top:16px;font-size:24px;color:var(--muted);font-weight:500}
  .sub b{color:var(--text);font-weight:600}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:84px}
  .card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:32px;padding:40px 32px 30px}
  .card.top{border:1.5px solid var(--cyan);
    box-shadow:0 0 0 6px rgba(34,195,230,.07),0 30px 80px -20px rgba(34,195,230,.35)}
  .tag{position:absolute;top:-17px;left:30px;background:var(--cyan);color:#041014;font-weight:700;font-size:15px;
    letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;border-radius:999px}

  .period{display:flex;align-items:baseline;justify-content:space-between}
  .period .n{font-family:Unbounded,sans-serif;font-weight:800;font-size:56px;letter-spacing:-2px;line-height:1}
  .period .u{font-size:20px;color:var(--muted);font-weight:600;margin-left:8px}
  .off{font-family:Unbounded,sans-serif;font-weight:600;font-size:16px;color:var(--cyan2);
    border:1px solid rgba(34,195,230,.35);background:rgba(34,195,230,.08);padding:6px 12px;border-radius:999px}
  .off.none{color:var(--muted);border-color:var(--line);background:transparent}

  .rows{margin-top:26px;border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;justify-content:space-between;padding:27px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .dev{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;color:#c9d3d8}
  .dev{gap:14px}
  .dev em{font-style:normal;font-family:Unbounded,sans-serif;font-weight:700;color:var(--cyan2);font-size:20px;
    width:56px;height:46px;display:grid;place-items:center;border-radius:14px;
    background:rgba(34,195,230,.09);border:1px solid rgba(34,195,230,.28)}
  .card.top .dev em{background:var(--cyan);color:#041014;border-color:var(--cyan)}
  .price{text-align:right}
  .price .p{font-family:Unbounded,sans-serif;font-weight:700;font-size:34px;letter-spacing:-.5px;line-height:1}
  .price .p small{font-size:20px;color:var(--muted);margin-left:4px;font-weight:600}
  .price .m{margin-top:6px;font-size:15px;color:var(--muted);font-weight:600}
  .card.top .price .m{color:var(--cyan2)}

  footer{position:absolute;left:96px;right:96px;bottom:60px;z-index:2;display:flex;gap:44px;align-items:center;
    font-size:21px;font-weight:600;color:#c9d3d8}
  footer div{display:flex;align-items:center;gap:12px}
  footer svg{width:24px;height:24px;stroke:var(--cyan);fill:none;stroke-width:1.8}
  footer .r{margin-left:auto;font-family:Unbounded,sans-serif;font-weight:700;font-size:26px;color:var(--text);letter-spacing:-.5px}
  footer .r{gap:0} footer .r span{color:var(--cyan)}
  footer .wl{color:#041014;background:var(--cyan);padding:10px 20px 10px 16px;border-radius:999px;font-weight:700}
  footer .wl svg{stroke:#041014;stroke-width:2.2}
</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div><div class="glow b"></div><div class="dot-xl"></div>

<div class="wrap">
  <header>
    <div class="logo">will<i></i></div>
    <div class="head-r">
      <h1>Тарифы<span>.</span></h1>
      <div class="sub">обходим <b>белые списки</b> · чем дольше период — тем <b>дешевле месяц</b></div>
    </div>
  </header>
  <div class="cards" id="cards"></div>
</div>

<footer>
  <div class="wl"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12h7M12 8.5v7" transform="rotate(45 12 12)"/></svg>обход белых списков</div>
  <div><svg viewBox="0 0 24 24"><path d="M4 12c0-3 2.5-5 5-5 4 0 4 10 8 10 2.5 0 5-2 5-5s-2.5-5-5-5c-4 0-4 10-8 10-2.5 0-5-2-5-5z" transform="translate(-1 0) scale(.95)"/></svg>безлимитный трафик</div>
  <div><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>19 серверов</div>
  <div><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>все тарифы — полный доступ</div>
  <div class="r">Kuro<span>.xyz</span></div>
</footer>

<script>
// цены: [устройства] -> {месяцев: цена}
const P = {
  5:  {1:159, 3:429,  6:809,  12:1499},
  10: {1:229, 3:619,  6:1169, 12:2099},
  20: {1:319, 3:859,  6:1629, 12:2999},
  30: {1:429, 3:1159, 6:2189, 12:3999},
};
const PERIODS = [[1,'месяц'],[3,'месяца'],[6,'месяцев'],[12,'месяцев']];
const fmt = n => n.toLocaleString('ru-RU').replace(/ /g,' ');

document.getElementById('cards').innerHTML = PERIODS.map(([m,u]) => {
  const off = Math.max(...Object.keys(P).map(d => Math.round((1 - P[d][m] / (P[d][1]*m)) * 100)));
  const top = m === 12;
  const rows = Object.keys(P).map(d => `
    <div class="row">
      <div class="dev"><em>${d}</em>устройств</div>
      <div class="price">
        <div class="p">${fmt(P[d][m])}<small>₽</small></div>
        ${m > 1 ? `<div class="m">≈ ${Math.round(P[d][m]/m)} ₽/мес</div>` : `<div class="m">в месяц</div>`}
      </div>
    </div>`).join('');
  return `<div class="card${top?' top':''}">
    ${top ? '<div class="tag">выгоднее всего</div>' : ''}
    <div class="period"><div><span class="n">${m}</span><span class="u">${u}</span></div>
      <div class="off${off>0?'':' none'}">${off>0 ? 'до −'+off+'%' : 'база'}</div></div>
    <div class="rows">${rows}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
